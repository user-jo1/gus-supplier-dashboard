# ============================================================
# GUS 看板 - Nginx 站点配置
# 
# 反爬/安全特性：
#   1. 限流：每IP每秒最多20个请求，突发30个
#   2. 连接数限制：每IP最多10个并发连接
#   3. 禁用常见爬虫UA直接返回403
#   4. 隐藏后端服务信息
#   5. robots.txt 禁止所有爬虫
# ============================================================

# ── 限流区域定义 ──
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# ── 爬虫UA黑名单 ──
map $http_user_agent $is_bot {
    default 0;
    "~*bot" 1;
    "~*crawler" 1;
    "~*spider" 1;
    "~*scraper" 1;
    "~*headless" 1;
    "~*curl" 1;
    "~*wget" 1;
    "~*python" 1;
    "~*java/" 1;
    "~*go-http" 1;
    "~*axios" 1;
    "~*node-fetch" 1;
    "~*okhttp" 1;
}

# ── HTTP 服务器（80端口）──
server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 爬虫UA直接拒绝
    if ($is_bot) {
        return 403;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }

    # 禁止直接访问敏感路径
    location ~* ^/(server\.js|package\.json|Dockerfile|docker-compose|node_modules|build_data\.py|build_dashboard\.py|deploy\.sh|check\.sh) {
        deny all;
        return 404;
    }

    # ── 登录页（严格限流）──
    location = /login.html {
        limit_req zone=login burst=3 nodelay;
        limit_conn connlimit 5;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API 接口（限流）──
    location /api/ {
        limit_req zone=general burst=30 nodelay;
        limit_conn connlimit 10;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 所有其他请求 ──
    location / {
        limit_req zone=general burst=30 nodelay;
        limit_conn connlimit 10;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓存静态资源
        location ~* \.(json|css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}
