<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUS 劳务供应商管理看板 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-box h1{font-size:22px;font-weight:800;color:#0f172a;text-align:center;margin-bottom:4px}
.login-box .sub{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;color:#1e293b;transition:border-color .2s;outline:none}
.form-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.form-group input::placeholder{color:#cbd5e1}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.btn:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af);box-shadow:0 4px 16px rgba(37,99,235,0.3);transform:translateY(-1px)}
.error{color:#dc2626;font-size:12px;text-align:center;margin-top:8px;display:none;padding:8px;background:#fef2f2;border-radius:6px}
.footer{text-align:center;font-size:10px;color:#94a3b8;margin-top:20px}
</style>
</head>
<body>
<div class="login-box">
  <h1>GUS 劳务供应商管理看板</h1>
  <div class="sub">请登录您的账号</div>
  <div class="form-group">
    <label>账号</label>
    <input type="text" id="username" placeholder="请输入账号" autocomplete="off">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn" onclick="doLogin()">登 录</button>
  <div class="error" id="error"></div>
  <div class="footer">© 2026 GUS · 劳务供应商管理看板 <span style="color:#cbd5e1;">v2026.07.17-4</span></div>
</div>

<script>
// ─── 缓存破坏 ───
var LOGIN_VERSION='20260717_1';
var cv=sessionStorage.getItem('login_ver');
if(cv&&cv!==LOGIN_VERSION){sessionStorage.setItem('login_ver',LOGIN_VERSION);location.reload(true);}
else{sessionStorage.setItem('login_ver',LOGIN_VERSION);}
// ─── 账号配置（仅管理员可管理，存储在 localStorage）───
const DEFAULT_USERS=[
  {username:'admin', hash:'00f77eccd9beca098fa138706a28d3837ce3f87d61e90b100535498b2f4b0967', role:'admin', regions:'*', label:'管理员'},
  {username:'fl', hash:'c7b4fe1061d8069cbe5366db76d31738b89c6f7e61099abce6a4c763d8d41100', role:'viewer', regions:'FL 佛州大区', label:'佛州大区'},
  {username:'gl', hash:'aef090467b7be68684d2a583dac8ec24d2350acc63b96516164e98a50edddce8', role:'viewer', regions:'GL 大湖大区', label:'大湖大区'},
  {username:'ms', hash:'65eae679399c67a88831004c89c5e051477b52e142c7c3b20d36ae77c742a856', role:'viewer', regions:'MS 中南大区', label:'中南大区'},
  {username:'ne', hash:'7547d999948052cbc4559c61cb5f5c02073ddbb6b29c05499a5ee603d323f79c', role:'viewer', regions:'NE 东北大区', label:'东北大区'},
  {username:'tx', hash:'2f62f1c7df95c7ee34ba31e3fcc93efa0becd5c9380c7c85bfdcedd2b8f69df9', role:'viewer', regions:'TX 德州大区', label:'德州大区'},
  {username:'we', hash:'570ab72800989abb9bf71bf27a8fb45ee8cbcaed6b07e190071ae4d3d750d230', role:'viewer', regions:'WE 美西大区', label:'美西大区'},
  {username:'ground', hash:'a1943efd5a2e0eace48368e356e683dff08420a0af279d5a25b44c54fbf71834', role:'viewer', regions:'Ground项目部', label:'Ground项目部'},
  {username:'ADMIN', hash:'64e48f3bf07307f751c02213b95e0b5e1e8351597dfbe12bce5cbf115591ce3f', role:'viewer', regions:'FL 佛州大区,GL 大湖大区,MS 中南大区,NE 东北大区,TX 德州大区,WE 美西大区,Ground项目部', label:'全美明细权限'},
];

// 初始化用户数据（版本号控制，更新DEFAULT_USERS时递增版本号）
const USERS_VERSION=4;
const storedVersion=parseInt(localStorage.getItem('gus_users_version')||'0');
if(!localStorage.getItem('gus_users')||storedVersion<USERS_VERSION){
  localStorage.setItem('gus_users',JSON.stringify(DEFAULT_USERS));
  localStorage.setItem('gus_users_version',String(USERS_VERSION));
}

function getUsers(){
  try{
    var users=JSON.parse(localStorage.getItem('gus_users'))||DEFAULT_USERS;
    // 确保所有用户有hash字段，兼容旧格式
    for(var i=0;i<users.length;i++){
      if(!users[i].hash&&users[i].password){
        var def=DEFAULT_USERS.find(function(d){return d.username===users[i].username;});
        if(def)users[i].hash=def.hash;
      }
    }
    return users;
  }catch(e){return DEFAULT_USERS}
}

function doLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const errorEl=document.getElementById('error');

  if(!username||!password){
    errorEl.textContent='请输入账号和密码';
    errorEl.style.display='block';
    return;
  }

  const users=getUsers();
  const inputHash=sha256(password);
  const user=users.find(u=>u.username===username&&(u.hash===inputHash));

  if(!user){
    errorEl.textContent='账号或密码错误，请重试';
    errorEl.style.display='block';
    return;
  }

  // 存储登录信息
  sessionStorage.setItem('gus_auth',JSON.stringify({
    username:user.username,
    role:user.role,
    regions:user.regions,
    label:user.label,
    loginTime:new Date().toISOString()
  }));

  // 跳转到看板
  window.location.href='dashboard.html';
}
// SHA-256 哈希函数
function sha256(str){
  function r(n,b){return n>>>b|n<<(32-b);}
  var h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var k=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var msg=unescape(encodeURIComponent(str));
  var ml=msg.length*8;
  var bytes=[];for(var i=0;i<msg.length;i++)bytes[i>>2]|=(msg.charCodeAt(i)&0xff)<<(24-(i%4)*8);
  bytes[msg.length>>2]|=0x80<<(24-(msg.length%4)*8);
  bytes[((ml+64>>9)<<4)+15]=ml;
  var w=new Array(64);
  for(var i=0;i<bytes.length;i+=16){
    var a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],i_=h[7];
    for(var j=0;j<64;j++){
      if(j<16)w[j]=bytes[i+j]||0;
      else{w[j]=(r(w[j-2],17)^r(w[j-2],19)^w[j-2]>>>10)+w[j-7]+(r(w[j-15],7)^r(w[j-15],18)^w[j-15]>>>3)+w[j-16];}
      var s1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=i_+s1+ch+k[j]+w[j];
      var s0=r(a,2)^r(a,13)^r(a,22),m=(a&b)^(a&c)^(b&c),t2=s0+m;
      i_=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;
    h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+i_)|0;
  }
  var hex='';for(var i=0;i<8;i++){var v=h[i];hex+=((v>>24)&0xff).toString(16).padStart(2,'0')+((v>>16)&0xff).toString(16).padStart(2,'0')+((v>>8)&0xff).toString(16).padStart(2,'0')+(v&0xff).toString(16).padStart(2,'0');}
  return hex;
}
</script>
</body>
</html>
