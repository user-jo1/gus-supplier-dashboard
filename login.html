<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUS 劳务供应商管理看板 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-box h1{font-size:22px;font-weight:800;color:#0f172a;text-align:center;margin-bottom:4px}
.login-box .sub{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;color:#1e293b;transition:border-color .2s;outline:none}
.form-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.form-group input::placeholder{color:#cbd5e1}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.btn:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af);box-shadow:0 4px 16px rgba(37,99,235,0.3);transform:translateY(-1px)}
.error{color:#dc2626;font-size:12px;text-align:center;margin-top:8px;display:none;padding:8px;background:#fef2f2;border-radius:6px}
.footer{text-align:center;font-size:10px;color:#94a3b8;margin-top:20px}
</style>
</head>
<body>
<div class="login-box">
  <h1>GUS 劳务供应商管理看板</h1>
  <div class="sub">请登录您的账号</div>
  <div class="form-group">
    <label>账号</label>
    <input type="text" id="username" placeholder="请输入账号" autocomplete="off">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn" onclick="doLogin()">登 录</button>
  <div class="error" id="error"></div>
  <div class="footer">© 2026 GUS · 劳务供应商管理看板</div>
</div>

<script>
// ─── 账号配置（仅管理员可管理，存储在 localStorage）───
const DEFAULT_USERS=[
  {username:'admin', password:'gus2026', role:'admin', regions:'*', label:'管理员'},
  {username:'fl', password:'gusfl2026', role:'viewer', regions:'FL 佛州大区', label:'佛州大区'},
  {username:'gl', password:'glgl2026', role:'viewer', regions:'GL 大湖大区', label:'大湖大区'},
  {username:'ms', password:'msgus2026', role:'viewer', regions:'MS 中南大区', label:'中南大区'},
  {username:'ne', password:'nenene2026', role:'viewer', regions:'NE 东北大区', label:'东北大区'},
  {username:'tx', password:'gustx26', role:'viewer', regions:'TX 德州大区', label:'德州大区'},
  {username:'we', password:'guswe2626', role:'viewer', regions:'WE 美西大区', label:'美西大区'},
  {username:'ground', password:'og2026', role:'viewer', regions:'Ground项目部', label:'Ground项目部'},
  {username:'ADMIN', password:'ADMIN2026', role:'viewer', regions:'FL 佛州大区,GL 大湖大区,MS 中南大区,NE 东北大区,TX 德州大区,WE 美西大区,Ground项目部', label:'全美明细权限'},
];

// 初始化用户数据（如果不存在）
if(!localStorage.getItem('gus_users')){
  localStorage.setItem('gus_users',JSON.stringify(DEFAULT_USERS));
}

function getUsers(){
  try{return JSON.parse(localStorage.getItem('gus_users'))||DEFAULT_USERS}
  catch(e){return DEFAULT_USERS}
}

function doLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const errorEl=document.getElementById('error');

  if(!username||!password){
    errorEl.textContent='请输入账号和密码';
    errorEl.style.display='block';
    return;
  }

  const users=getUsers();
  const user=users.find(u=>u.username===username&&u.password===password);

  if(!user){
    errorEl.textContent='账号或密码错误，请重试';
    errorEl.style.display='block';
    return;
  }

  // 存储登录信息
  sessionStorage.setItem('gus_auth',JSON.stringify({
    username:user.username,
    role:user.role,
    regions:user.regions,
    label:user.label,
    loginTime:new Date().toISOString()
  }));

  // 跳转到看板
  window.location.href='dashboard.html';
}
</script>
</body>
</html>
